# Ein Host, ein Prozess: die Plattform hält je Mandant eine eigene SQLite-Datei,
# also genau einen schreibenden Prozess. Mehr Replicas sind kein Skalierungspfad,
# sondern Datenverlust — deshalb bewusst ein einziger `app`-Dienst.
#
# Erreichbar ist der Stack nur über einen eigenen Tailnet-Knoten (`tailscale`).
# Der Stack veröffentlicht keine Host-Ports; `app` ist nur im Compose-Netz und
# über den Tailnet-Knoten erreichbar. Kein Funnel, kein öffentlicher Zugang.
#
# Pflichtwert `SF_TAILNET_DOMAIN` kommt aus `.env` (Compose liest sie automatisch).
# Vorlage: `.env.production.example`. Fehlt der Wert, bricht schon die
# Konfiguration ab, statt einen Container mit unbrauchbarer Origin zu starten.
#
# Nur `SF_*` aus `.env` verwenden, nie `TS_*` aus der Host-Umgebung lesen: dort
# können `TS_HOSTNAME`/`TS_AUTHKEY` global gesetzt sein und würden den Knoten
# umbenennen.

name: smartflow

services:
  app:
    build:
      context: .
    image: smartflow-platform:local
    restart: unless-stopped
    # Der Prozess läuft im Image als `node` und bindet 8790; er braucht keine
    # Capabilities und darf keine dazugewinnen. Gleiche Härtung wie beim
    # Tailscale-Dienst.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Aus Knotenname und Tailnet-Domain zusammengesetzt, damit die Adresse des
      # Knotens und die Anwendungs-Origin nicht auseinanderlaufen können.
      # `SF_TAILNET_DOMAIN` ist der reine Hostname-Rest (ohne Schema und Punkt
      # davor), z. B. `example-tailnet.ts.net`.
      SF_PUBLIC_URL: https://${SF_TS_NODE_NAME:-smartflow-platform}.${SF_TAILNET_DOMAIN:?SF_TAILNET_DOMAIN fehlt in .env}
      # Kein Konto-Seed: den ersten Operator legt die Ersteinrichtung im Browser an.
      SF_LOG_LEVEL: ${SF_LOG_LEVEL:-info}
      # Korrekt, weil Tailscale Serve als einziger Proxy davorsteht und
      # X-Forwarded-For setzt. Ohne Proxy wäre das Vertrauen in den Header
      # falsch; die Topologie gehört deshalb zu dieser Datei, nicht in ein
      # Image-Default.
      SF_TRUST_PROXY: '1'
      # Eine Website, ein Port: die Auslieferung lauscht auf 8801…8820 im
      # Compose-Netz, `tailscale serve` bildet diese auf 8443…8462 am Knoten ab.
      # Keine Host-Ports, kein Funnel.
      SF_SITES_PORT_BASE: ${SF_SITES_PORT_BASE:-8801}
      SF_SITES_PORT_COUNT: ${SF_SITES_PORT_COUNT:-20}
      SF_SITES_TAILNET_PORT_BASE: ${SF_SITES_TAILNET_PORT_BASE:-8443}
    volumes:
      - data:/data
    expose:
      - '8790'
      - '8801-8820'
    # Der Healthcheck stammt aus dem Image und trägt `depends_on` unten.

  tailscale:
    # Eigener Knoten als Dienst, bewusst nicht im Netzwerk-Namespace von `app`
    # (`network_mode: service:app`): das geteilte Namespace ginge mit jedem
    # Neustart von `app` verloren. Die App wird über den Dienstnamen erreicht.
    # Serve-Konfiguration ist ins Image gebacken (siehe deploy/tailscale/Dockerfile).
    build:
      context: ./deploy/tailscale
    image: smartflow-platform-tailscale:local
    restart: unless-stopped
    # Userspace-Netzwerk braucht weder Capabilities noch Rechteausweitung.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      app:
        condition: service_healthy
    environment:
      TS_USERSPACE: 'true'
      TS_STATE_DIR: /var/lib/tailscale
      TS_HOSTNAME: ${SF_TS_NODE_NAME:-smartflow-platform}
      TS_SERVE_CONFIG: /config/serve.json
      # Einmaliger, kurzlebiger Key für die erste Anmeldung; leer, wenn der
      # Knoten-Zustand im Volume schon autorisiert ist.
      TS_AUTHKEY: ${SF_TS_AUTHKEY:-}
      TS_EXTRA_ARGS: --accept-dns=false --accept-routes=false
    volumes:
      - tailscale_state:/var/lib/tailscale

volumes:
  # Plattform-Datenbank, je Mandant eine Datenbank und der Schlüssel für die
  # Sitzungen — der einzige Teil, der gesichert werden muss.
  data:
  # Knoten-Identität im Tailnet; ein Verlust kostet nur eine Neuanmeldung.
  tailscale_state:
    # Fester Name: ein bereits autorisierter Knoten-Zustand wird wiederverwendet.
    name: ${SF_TS_STATE_VOLUME:-smartflow-ts-state}
